apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.bugsnag.android.gradle"

/**
 * React Native Configuration
 */
react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc-intl:+'

android {

    // *** CORRECT NAMESPACE ***
    namespace "io.bluewallet.bluewallet"

    compileSdkVersion rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "org.interchained.elara"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 808
        versionName "8.8.8-oracle"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    androidResources {
        noCompress += ["bundle"]
    }

    sourceSets {
        main {
            assets.srcDirs = [
                    "src/main/assets",
                    "src/main/res/assets"
            ]
        }
    }

    buildTypes {
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"),
                    "proguard-rules.pro"
            proguardFile "${rootProject.projectDir}/../node_modules/detox/android/detox/proguard-rules-app.pro"
        }
    }

    // *** 16 KB PAGE SIZE SAFE PACKAGING ***
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

/** REMOVE CONCEAL – IT CRASHES ON 16 KB DEVICES */
configurations.all {
    exclude group: "com.facebook.conceal", module: "conceal"
}

/** Copy fiatUnits.json */
task copyFiatUnits(type: Copy) {
    from '../../models/fiatUnits.json'
    into 'src/main/assets'
}
preBuild.dependsOn(copyFiatUnits)

dependencies {
    androidTestImplementation "com.wix:detox:+"

    implementation "com.facebook.react:react-android"

    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.work:work-runtime-ktx:2.10.2"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.compose.ui:ui:1.8.3"
    implementation "androidx.compose.material3:material3:1.3.2"

    // Hermes or JSC
    if (hermesEnabled.toBoolean()) {
        implementation "com.facebook.react:hermes-android"
    } else {
        implementation jscFlavor
    }

    androidTestImplementation "com.wix:detox:0.1.1"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
}
