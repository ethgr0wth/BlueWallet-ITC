// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        minSdkVersion = 24
        buildToolsVersion = "35.0.0"
        compileSdkVersion = 35
        targetSdkVersion = 35

        // Legacy versions used by some libs (harmless if unused)
        googlePlayServicesVersion = "16.+"
        googlePlayServicesIidVersion = "16.0.1"
        firebaseVersion = "17.3.4"
        firebaseMessagingVersion = "21.1.0"

        // 🔐 NDK & Kotlin aligned with RN 0.75.x
        ndkVersion = "26.1.10909125"
        kotlin_version = "1.9.24"
        kotlinVersion  = "1.9.24"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // 🔧 AGP compatible with RN 0.75.x
        classpath("com.android.tools.build:gradle:8.3.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
        classpath("com.google.gms:google-services:4.4.3")
        classpath("com.bugsnag:bugsnag-android-gradle-plugin:8.2.0")
    }
}

allprojects {
    repositories {
        // Detox
        maven {
            url("$rootDir/../node_modules/detox/Detox-android")
        }

        mavenCentral {
            // Do not pull react-native from Maven Central
            content {
                excludeGroup "com.facebook.react"
            }
        }

        mavenLocal()

        // React Native Android artifacts from node_modules
        maven {
            url("$rootDir/../node_modules/react-native/android")
        }

        // JSC from node_modules
        maven {
            url("$rootDir/../node_modules/jsc-android/dist")
        }

        google()
        maven { url 'https://www.jitpack.io' }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            android {
                // Keep everything in sync with root ext
                buildToolsVersion rootProject.ext.buildToolsVersion
                compileSdkVersion rootProject.ext.compileSdkVersion
                defaultConfig {
                    minSdkVersion rootProject.ext.minSdkVersion
                    targetSdkVersion rootProject.ext.targetSdkVersion
                }
            }
        }

        // 🔥 Make sure all Kotlin modules target JVM 17
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}
