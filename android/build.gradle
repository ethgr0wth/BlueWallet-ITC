buildscript {
    ext {
        minSdkVersion = 24
        buildToolsVersion = "35.0.0"
        compileSdkVersion = 35
        targetSdkVersion = 35

        ndkVersion = "26.1.10909125"   // <- REQUIRED FOR RN STABILITY

        kotlin_version = '1.9.24'      // <- REQUIRED FOR RN 0.75.x
        kotlinVersion  = '1.9.24'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.3.2")   // <- REQUIRED for RN 0.75.x
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
        classpath("com.google.gms:google-services:4.4.3")
        classpath("com.bugsnag:bugsnag-android-gradle-plugin:8.2.0")
    }
}

allprojects {
    repositories {
        maven { url("$rootDir/../node_modules/detox/Detox-android") }

        mavenCentral {
            content { excludeGroup "com.facebook.react" }
        }

        mavenLocal()

        maven { url("$rootDir/../node_modules/react-native/android") }
        maven { url("$rootDir/../node_modules/jsc-android/dist") }

        google()
        maven { url 'https://www.jitpack.io' }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            android {
                buildToolsVersion "35.0.0"
                compileSdkVersion 35
                defaultConfig {
                    minSdkVersion 24
                }
            }
        }

        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
            kotlinOptions.jvmTarget = "17"
        }
    }
}
